name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: smart_canteen_web/backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r smart_canteen_web/backend/requirements.txt
      - name: Run stable backend tests
        run: python -m pytest smart_canteen_web/backend/tests -q
